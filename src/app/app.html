<div class="game-container">
  <!-- Header / HUD -->
  <header class="game-header">
    <div class="logo">
      <h1>🌟 Tập Đọc 🌟</h1>
    </div>
    <div class="controls">
      <input type="file" #fileInput accept=".json,.txt,.csv" style="display: none" (change)="onFileSelected($event)">
      <button class="btn btn-import" (click)="fileInput.click()">
        <span class="icon">📂</span> Nhập từ vựng
      </button>
      <div class="vocab-count" title="Danh sách từ: {{ vocabulary().join(', ') }}">
        📚 Đang có: {{ vocabulary().length }} từ
      </div>
    </div>
    <div class="stats">
      <div class="score-board">
        <span class="star-icon">⭐</span>
        <span class="score-text">Điểm: {{ score() }}</span>
      </div>
    </div>
  </header>

  <!-- Main Game Area -->
  <main class="game-board">
    <!-- Background decorations -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="sun"></div>

    <!-- Falling Word -->
    @if (activeWord(); as word) {
      <div 
        class="falling-word" 
        [style.left.%]="word.xPosition" 
        [style.top.%]="word.yPosition">
        {{ word.text }}
      </div>
    }

    <!-- Bottom ground/grass area -->
    <div class="ground">
      <div class="grass-tuft t1"></div>
      <div class="grass-tuft t2"></div>
      <div class="grass-tuft t3"></div>
    </div>
  </main>

  <!-- Footer / Controls -->
  <footer class="game-footer">
    <div class="mic-status" [class.listening]="isListening()">
      @if (isListening()) {
        <span class="status-text">Đang nghe... 🎤 Hãy đọc thật to nhé!</span>
      } @else {
        <span class="status-text">Bấm Bắt Đầu để chơi nha</span>
      }
    </div>

    <button 
      class="btn btn-mic" 
      [class.active]="isListening()" 
      (click)="toggleListening()">
      <div class="mic-icon">🎙️</div>
      <span>{{ isListening() ? 'Tạm Dừng' : 'Bắt Đầu' }}</span>
    </button>
  </footer>
</div>
